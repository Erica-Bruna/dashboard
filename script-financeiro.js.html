<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Visão Geral Financeira - Omie</title>
  <!-- Chart.js para os gráficos -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <!-- PapaParse para ler os CSVs publicados do Google Sheets -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
  <style>
    :root {
      --bg-color: #121212;
      --card-bg: #1A1A1A;
      --border-color: #2A2A2A;
      --primary-orange: #E85D17;
      --text-main: #FFFFFF;
      --text-muted: #A0A0A0;
    }
    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      margin: 0;
      padding: 20px;
    }
    h1 {
      text-align: center;
      color: var(--primary-orange);
      margin-bottom: 25px;
    }
    .filtros-container {
      display: flex;
      justify-content: center;
      gap: 15px;
      margin-bottom: 30px;
      background: var(--card-bg);
      padding: 15px;
      border-radius: 8px;
      border: 1px solid var(--border-color);
    }
    .kpi-container {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 20px;
      margin-bottom: 30px;
    }
    .kpi-card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 20px;
      text-align: center;
    }
    .kpi-card h3 {
      font-size: 0.9em;
      color: var(--text-muted);
      margin-bottom: 10px;
    }
    .kpi-card .valor {
      font-size: 1.6em;
      font-weight: bold;
      color: var(--text-main);
    }
    .main-grid {
      display: grid;
      grid-template-columns: 2fr 1fr;
      gap: 20px;
    }
    @media (max-width: 900px) {
      .main-grid { grid-template-columns: 1fr; }
    }
    .painel-box {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 20px;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 15px;
    }
    th, td {
      padding: 12px;
      text-align: left;
      border-bottom: 1px solid var(--border-color);
      font-size: 0.9em;
    }
    th {
      color: var(--primary-orange);
      font-weight: 600;
    }
  </style>
</head>
<body>

  <h1>Contas a Pagar REACH</h1>

  <!-- Filtro de Datas -->
  <div class="filtros-container">
    <div>
      <label>De:</label>
      <input type="date" id="filtro-data-inicio" onchange="carregarDashboardFinanceiro()">
    </div>
    <div>
      <label>Até:</label>
      <input type="date" id="filtro-data-fim" onchange="carregarDashboardFinanceiro()">
    </div>
  </div>

  <!-- Cards de KPIs -->
  <div class="kpi-container">
    <div class="kpi-card">
      <h3>Total a Pagar (Período)</h3>
      <div class="valor" id="kpi-total-pagar" style="color: #3498db;">R$ 0,00</div>
    </div>
    <div class="kpi-card">
      <h3>Total Pago (Caixa)</h3>
      <div class="valor" id="kpi-total-pago" style="color: #E85D17;">R$ 0,00</div>
    </div>
    <div class="kpi-card">
      <h3>Total Atrasado (Pagar)</h3>
      <div class="valor" id="kpi-total-atrasado-pagar" style="color: #e74c3c;">R$ 0,00</div>
    </div>
  </div>

  <!-- Grid Principal (Tabela + Gráfico de Despesas por Categoria) -->
  <div class="main-grid">
    <div class="painel-box">
      <h3 id="titulo-tabela-pagar" style="margin-top:0; color: var(--primary-orange);">Contas a Pagar</h3>
      <div style="overflow-x: auto;">
        <table>
          <thead>
            <tr>
              <th>Fornecedor</th>
              <th>Categoria</th>
              <th>Vencimento</th>
              <th>Documento</th>
              <th>Valor</th>
            </tr>
          </thead>
          <tbody id="tb-pagar">
            <!-- Preenchido via JavaScript -->
          </tbody>
        </table>
      </div>
    </div>

    <div class="painel-box">
      <h3 style="margin-top:0; color: var(--primary-orange); text-align: center;">Despesas por Categoria</h3>
      <div style="position: relative; height: 300px; display: flex; justify-content: center; align-items: center;">
        <canvas id="graficoDespesasPizza"></canvas>
      </div>
    </div>
  </div>

  <!-- Script JavaScript -->
  <script src="script-financeiro.js"></script>
</body>
</html>
